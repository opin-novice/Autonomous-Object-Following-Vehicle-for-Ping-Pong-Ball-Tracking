; Webots controller runtime configuration.
;
; Pins the Python interpreter Webots launches for this controller to the project venv.
; Without this file Webots falls back to its "Python command" preference (default
; "python"), which on this machine resolves to C:\Python314\python.exe and therefore to
; OpenCV 4.13.0 - a different major version from the 5.0.0 this project is pinned to.
;
; VERIFIED 2026-09-08 against Webots R2025a, by running a probe controller three times
; with the venv deactivated and PATH reset to the persisted machine+user PATH (i.e. what
; a Start-Menu launch of Webots actually inherits):
;
;   no runtime.ini              -> C:\Python314\python.exe   3.14.0   cv2 4.13.0
;   relative COMMAND path       -> controller fails to start (relative paths not resolved)
;   absolute COMMAND path       -> .venv\Scripts\python.exe   3.12.10  cv2 5.0.0
;
; The path MUST be absolute - Webots does not resolve a relative COMMAND. If the project
; is moved or cloned to another location, this one line has to be updated.

[python]
COMMAND = d:/Autonomous Car/.venv/Scripts/python.exe
